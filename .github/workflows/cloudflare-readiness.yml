name: Cloudflare readiness

on:
  push:
    branches:
      - main
      - migration/cloudflare-workers
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for Cloudflare Workers
        run: npm run cf-build
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Check Cloudflare deploy credentials
        id: cloudflare-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy main to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && steps.cloudflare-auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Publish temporary preview when production auth is unavailable
        if: github.ref == 'refs/heads/main' && steps.cloudflare-auth.outputs.ready != 'true'
        run: npx wrangler deploy --temporary
