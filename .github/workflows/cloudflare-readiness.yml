name: Cloudflare readiness

on:
  push:
    branches:
      - main
      - migration/cloudflare-workers
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for Cloudflare Workers
        run: npm run cf-build
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Check Cloudflare deploy credentials
        id: cloudflare-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy main to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && steps.cloudflare-auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Publish and verify temporary preview when production auth is unavailable
        if: github.ref == 'refs/heads/main' && steps.cloudflare-auth.outputs.ready != 'true'
        run: |
          set -o pipefail
          set +e
          npx wrangler deploy --temporary --config wrangler.preview.jsonc 2>&1 | tee temporary-deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            if grep -qi 'exceeded.*size limit\|exceeded the size limit' temporary-deploy.log; then
              echo "::warning::Temporary Cloudflare preview could not be published because the anonymous preview account size limit was exceeded. Build and wrangler dry-run already passed."
              exit 0
            fi
            exit "$DEPLOY_EXIT"
          fi
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' temporary-deploy.log | tail -n 1)"
          test -n "$PREVIEW_URL"
          echo "Preview URL: $PREVIEW_URL"
          HTML=""
          for i in 1 2 3 4 5; do
            if HTML="$(curl -fsSL "$PREVIEW_URL")"; then
              break
            fi
            sleep 2
          done
          test -n "$HTML"
          echo "$HTML" | grep -q 'ECの面倒を'
          echo "$HTML" | grep -q 'アプリにする'
          AMAZON_HTML="$(curl -fsSL "$PREVIEW_URL/amazon-margin")"
          echo "$AMAZON_HTML" | grep -q 'Amazon'
          echo "$AMAZON_HTML" | grep -q '限界ROAS'
          THUMBNAIL_HTML="$(curl -fsSL "$PREVIEW_URL/thumbnail-checker")"
          echo "$THUMBNAIL_HTML" | grep -q '自社だけ弱い理由'
          echo "$THUMBNAIL_HTML" | grep -q 'SEARCH THUMBNAIL CHECKER'
          echo "Verified ECP concept, Amazon margin calculator, and thumbnail checker UI on $PREVIEW_URL"
