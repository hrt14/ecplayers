name: Current-tree privacy check - ecplayers

on:
  push:
    branches:
      - security/public-history-audit-20260919

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch current main only
        run: git fetch --depth=1 origin '+refs/heads/main:refs/remotes/origin/main'
      - name: Scan main tree without exposing matching content
        run: |
          python3 - <<'PY'
          import json,re,subprocess
          from collections import Counter
          def git(*a):return subprocess.check_output(['git',*a],stderr=subprocess.DEVNULL)
          patterns={
            'email':re.compile(rb'(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'),
            'credential':re.compile(rb'(?i)(?:api[_-]?key|secret|token|password|passwd|private[_-]?key)\s*[:=]\s*[\'\"][^\'\"\r\n]{6,}[\'\"]'),
            'private_key':re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
            'github_token':re.compile(rb'\b(?:ghp_|github_pat_)[A-Za-z0-9_-]{20,}\b'),
            'stripe_secret':re.compile(rb'\bsk_(?:live|test)_[A-Za-z0-9]{12,}\b'),
            'aws_key':re.compile(rb'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'),
            'local_path':re.compile(rb'(?i)(?:/Users/[^/\s]+/|[A-Z]:\\Users\\[^\\\s]+\\)'),
            'family_review':re.compile('次女|長女|不登校|精神科|ADHD|ASD|家族|娘|妻|クリニック|通院'.encode()),
            'business_review':re.compile('年収|給与|月商|売上目標|取引先|クライアント|顧客情報|報酬'.encode()),
          }
          counts=Counter(); paths={}; scanned=0; skipped=0
          for entry in git('ls-tree','-r','-z','origin/main').split(b'\0'):
            if not entry:continue
            meta,p=entry.split(b'\t',1); mode,typ,sha=meta.split()
            if typ!=b'blob':continue
            if int(git('cat-file','-s',sha.decode()))>1000000:skipped+=1;continue
            data=git('cat-file','-p',sha.decode())
            if b'\0' in data:skipped+=1;continue
            scanned+=1
            path=p.decode('utf8','replace');safe=path if re.fullmatch('[A-Za-z0-9_./-]+',path) else '(non-ASCII path)'
            for k,pat in patterns.items():
              hits=pat.findall(data)
              if k=='email':hits=[x for x in hits if not x.lower().endswith((b'@example.com',b'@example.org',b'@users.noreply.github.com'))]
              if hits:counts[k]+=1;paths.setdefault(k,[]).append(safe)
          print(json.dumps({'scope':'current tree only, not history','scanned':scanned,'skipped_binary_or_large':skipped,'counts':dict(counts),'paths_no_contents':paths},ensure_ascii=False,sort_keys=True))
          PY