name: Vercel production deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vercel-production-deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel deploy credential
        id: auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not configured in this repository."
          fi

      - uses: actions/setup-node@v4
        if: steps.auth.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Link repository checkout to ECplayers project
        if: steps.auth.outputs.ready == 'true'
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_vCUqyPcmj2xuDuBM7f7aOiMQ","projectId":"prj_BsapRYAxbwEDvuFCAQbZjbiGek95"}' > .vercel/project.json

      - name: Deploy current main to Vercel production
        if: steps.auth.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --force --token="$VERCEL_TOKEN"
